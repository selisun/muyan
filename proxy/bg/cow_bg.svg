<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E9BDE"/>
      <stop offset="0.45" stop-color="#7FC5EB"/>
      <stop offset="0.78" stop-color="#C3E7F4"/>
      <stop offset="1" stop-color="#EAF7F2"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CBF5A"/>
      <stop offset="0.35" stop-color="#5FA53F"/>
      <stop offset="1" stop-color="#3F7D2E"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.7" stop-color="#FFEFB5"/>
      <stop offset="1" stop-color="#FFE79A"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFEFB5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFEFB5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="1560" cy="170" r="150" fill="url(#sunGlow)"/>
  <circle cx="1560" cy="170" r="62" fill="url(#sun)"/>

