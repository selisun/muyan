    <g stroke="#72491F" stroke-width="2" opacity="0.6">
      <path d="M878 580 L878 930"/>
      <path d="M904 580 L904 930"/>
      <path d="M1208 580 L1208 930"/>
      <path d="M1234 580 L1234 930"/>
