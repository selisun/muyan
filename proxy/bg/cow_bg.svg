      <ellipse cx="78" cy="-20" rx="78" ry="38"/>
      <ellipse cx="-72" cy="-14" rx="66" ry="32"/>
      <ellipse cx="10" cy="24" rx="150" ry="34"/>
    </g>
    <g transform="translate(760,86) scale(0.85)">
      <ellipse cx="0" cy="6" rx="120" ry="38"/>
      <ellipse cx="78" cy="-20" rx="78" ry="38"/>
      <ellipse cx="-72" cy="-14" rx="66" ry="32"/>
      <ellipse cx="10" cy="24" rx="150" ry="34"/>
    </g>
    <g transform="translate(1120,205) scale(0.6)">
      <ellipse cx="0" cy="6" rx="120" ry="38"/>
      <ellipse cx="78" cy="-20" rx="78" ry="38"/>
      <ellipse cx="-72" cy="-14" rx="66" ry="32"/>
      <ellipse cx="10" cy="24" rx="150" ry="34"/>
