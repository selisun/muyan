<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC8E3"/>
      <stop offset="0.55" stop-color="#BDE3F0"/>
      <stop offset="1" stop-color="#EAF6F4"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CBF5A"/>
      <stop offset="0.35" stop-color="#5FA53F"/>
      <stop offset="1" stop-color="#3F7D2E"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.7" stop-color="#FFEFB5"/>
      <stop offset="1" stop-color="#FFE79A"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFEFB5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFEFB5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="1560" cy="170" r="150" fill="url(#sunGlow)"/>
  <circle cx="1560" cy="170" r="62" fill="url(#sun)"/>

  <!-- 云朵 -->
  <g fill="#FFFFFF" opacity="0.92">
    <g transform="translate(260,140) scale(1)">
      <ellipse cx="0" cy="0" rx="90" ry="34"/>
      <ellipse cx="62" cy="-14" rx="66" ry="30"/>
      <ellipse cx="-58" cy="-10" rx="56" ry="26"/>
      <ellipse cx="18" cy="18" rx="120" ry="30"/>
    </g>
    <g transform="translate(760,90) scale(0.72)">
      <ellipse cx="0" cy="0" rx="90" ry="34"/>
      <ellipse cx="62" cy="-14" rx="66" ry="30"/>
      <ellipse cx="-58" cy="-10" rx="56" ry="26"/>
      <ellipse cx="18" cy="18" rx="120" ry="30"/>
    </g>
    <g transform="translate(1180,240) scale(0.55)">
      <ellipse cx="0" cy="0" rx="90" ry="34"/>
      <ellipse cx="62" cy="-14" rx="66" ry="30"/>
      <ellipse cx="-58" cy="-10" rx="56" ry="26"/>
      <ellipse cx="18" cy="18" rx="120" ry="30"/>
