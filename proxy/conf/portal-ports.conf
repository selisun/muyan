# 牧颜 合并窗口 server：统一网关接入（unix socket）
# 网关校验 fnOS 登录态后，把 /app/muyan/* 请求转发到 ${TRIM_APPDEST}/app.sock，
# 本 server 监听到该 Socket（容器内路径 /app/target/app.sock，由 compose 挂载 ${TRIM_APPDEST}:/app/target:rw）。
# 网关转发时保留完整前缀 URI，故先剥离 /app/muyan 前缀，再复用无前缀的 portal-common 路由。
# 静态文件，无需运行时生成。

server {
    listen unix:/app/target/app.sock;

    server_name _;

    # 无尾斜杠 -> 带尾斜杠（保证落进下面的前缀 location，最终由 / 输出合并窗口页）
    location = /app/muyan {
        return 302 /app/muyan/;
    }

    # 剥离统一网关前缀，重新匹配无前缀的 portal-common 路由
    location ^~ /app/muyan/ {
        rewrite ^/app/muyan/(.*)$ /$1 last;
    }

    # 合并窗口路由（/ 页面、/api/login、/api/logout、/api/settings、/custom_bg.webp）
    include /etc/nginx/lhg/portal-common.conf;
}