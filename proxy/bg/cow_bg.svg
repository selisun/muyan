  <!-- 牧场大门：门柱 -->
  <g>
    <rect x="866" y="560" width="50" height="386" rx="10" fill="#8A5A2B" stroke="#5E3A17" stroke-width="4"/>
    <rect x="1196" y="560" width="50" height="386" rx="10" fill="#8A5A2B" stroke="#5E3A17" stroke-width="4"/>
