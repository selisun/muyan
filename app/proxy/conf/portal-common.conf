# 牧颜 合并窗口路由（被 portal-ports.conf 的 server 块 include）
# 单页架构：/ 为上传背景+模板设置页，免登录——统一网关已校验 fnOS 登录态，
# 写操作（POST /api/settings、PUT /custom_bg.webp）在 Lua 内校验 X-Trim-Isadmin 管理员头
# 其余一律 404

location = / {
    # 直接以 Lua 读取并输出页面文件：避免 alias 到文件时被 nginx index 模块
    # 干扰（会把 / 解析为 alias+index.html 导致 404），保证合并窗口页稳定返回
    default_type text/html;
    charset utf-8;
    add_header cache-control "no-cache";
    content_by_lua_block {
        ngx.header["content_type"] = "text/html; charset=utf-8";
        ngx.header["cache-control"] = "no-cache";
        local f = io.open("/usr/share/nginx/html/bg/index.html", "rb");
        if not f then
            ngx.log(ngx.ERR, "index.html not found: /usr/share/nginx/html/bg/index.html");
            ngx.exit(ngx.HTTP_NOT_FOUND);
        end
        local data = f:read("*a");
        f:close();
        ngx.say(data);
    }
}

location = /api/settings {
    content_by_lua_file /etc/nginx/lhg/lua/settings.lua;
}

# 背景图上传接口：前端 canvas 转 1920x1080 webp 后 PUT 到此，Lua 直接覆盖文件
location = /custom_bg.webp {
    client_max_body_size 30m;
    content_by_lua_file /etc/nginx/lhg/lua/portal_put.lua;
}

location / {
    return 404;
}
