    <!-- 柱顶三角帽 -->
    <path d="M852 562 L930 562 L891 512 Z" fill="#A06A35" stroke="#5E3A17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1182 562 L1260 562 L1221 512 Z" fill="#A06A35" stroke="#5E3A17" stroke-width="4" stroke-linejoin="round"/>
