# fnOS 登录页换背景 · 反向代理 + 合并窗口页（OpenResty 版）
# 部署位置: NAS ${TRIM_PKGVAR}/proxy/conf/default.conf，由 docker-compose 挂载进容器
#
# 两个服务：
#   443(宿主 wizard_port，默认 11766)  fnOS 登录页美化反代（本文件下方 server），应用自签证书
#                        （CN=muyan，由 cmd/install_callback 用宿主机 openssl 生成）
#   unix socket          合并窗口页：上传背景+模板设置 单页（由 fnOS 统一网关接入，
#                        桌面图标 → /app/muyan → 网关转发到 ${TRIM_APPDEST}/app.sock；
#                        见 portal-ports.conf / portal-common.conf）
#
# 安全要求（公网可访问前提）：
#   1) HTTP(80) 一律 301 跳 HTTPS
#   2) 窗口页免登录（统一网关已校验 fnOS 登录态），写操作在 Lua 校验 X-Trim-Isadmin 管理员头
#   3) 配置仅存模板名（/config/portal.json），无账号密码等敏感数据
#
# 原理: fnOS 登录页 JS 请求的背景是一个字面量 URL /static/bg/wallpaper-1.webp(无 hash)，
#       因此反代层精确拦截该 URL 并 alias 到挂载目录里的自定义图即可，无需改任何 fnOS 文件。

# Lua 模块搜索路径（conf/lua/ 挂载于 /etc/nginx/lhg/lua/）
lua_package_path "/etc/nginx/lhg/lua/?.lua;;";

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # fnOS 应用中心生成的 Docker 链接是 http://IP:<wizard_port>（明文打到本 TLS 端口会触发
    # nginx 497 错误）。此处把 497 重定向到 https，浏览器点链接即可正常打开。
    # $http_host 保留原始端口（默认 11766），避免 $host 丢端口后跳到 443。
    error_page 497 =301 https://$http_host$request_uri;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 上游为动态拼装（IP 字面量，见下方 rewrite_by_lua_block），IP 直连不经过 DNS，
    # 故无需 resolver。注意：host.docker.internal 由 compose extra_hosts 写入容器
    # /etc/hosts，docker 内嵌 DNS(127.0.0.11) 不解析 /etc/hosts 条目，变量 proxy_pass
    # 配 resolver 反而会报 "host.docker.internal could not be resolved"。

    # 登录页背景：拦截固定 URL /static/bg/wallpaper-1.webp，替换为挂载目录中的自定义图。
    #   classic/focus: 用户自定义背景 custom_bg.webp
    #   minimal:       纯色极简 solid_bg.webp
    #   cow:           牧场草地专属背景 cow_bg.svg（牛吃草）
    location = /static/bg/wallpaper-1.webp {
        set $bgfile custom_bg.webp;
        # 注意: rewrite_by_lua 在标准 rewrite 模块(set/if)之后执行，
        # 用 if ($bgfile = ...) 判断永远读到旧值（不生效）——必须用 ngx.exec 内部跳转。
        rewrite_by_lua_block {
            local ok, c = pcall(require, "common")
            if ok then
                local cfg = c.loadjson("/config/portal.json") or {}
                if cfg.template == "cow" then
                    -- 跳到专设 location：否则按原 URI 的 .webp 后缀返回 image/webp，
                    -- 浏览器把 SVG 当 webp 解析失败 → 牛牛牧场背景整片不显示（只剩纯色+牛）
                    return ngx.exec("/static/bg/cow_bg.svg")
                elseif cfg.template == "minimal" then
                    ngx.var.bgfile = "solid_bg.webp"
                end
            end
        }
        alias /usr/share/nginx/html/bg/$bgfile;
        default_type image/webp;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # cow 模板牧场背景（SVG 正确 MIME）
    location = /static/bg/cow_bg.svg {
        alias /usr/share/nginx/html/bg/cow_bg.svg;
        default_type image/svg+xml;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 一言语料：登录页左侧显示的句子，换句子只改 bg/quote.txt
    location = /static/lhg-quote.txt {
        alias /usr/share/nginx/html/bg/quote.txt;
        default_type text/plain;
        charset utf-8;
        add_header cache-control "no-cache";
    }

    # 牛牛模板动画脚本（cow 模板时由注入 JS 动态加载；独立文件不受 sub_filter 转义限制）
    location = /static/lhg-cow.js {
        alias /usr/share/nginx/html/bg/cow.js;
        default_type application/javascript;
        charset utf-8;
        add_header cache-control "no-cache";
    }

    # 当前美化模板下发（公开，仅输出 classic/focus/minimal/cow 一个单词）
    # 注入 JS 据此决定登录框位置/是否显示一言/是否纯色背景/是否加载附加脚本
    location = /static/lhg-template.txt {
        default_type text/plain;
        content_by_lua_file /etc/nginx/lhg/lua/template.lua;
    }

    # WebSocket 长连接(登录页设备状态推送)，必须转发升级头，否则超时 504 卡"加载中"
    location /websocket {
        set $fnos_upstream "http://172.17.0.1:5666";
        rewrite_by_lua_block {
            local port = "5666"
            local f = io.open("/config/upstream.conf", "r")
            if f then
                local line = f:read("*l"); f:close()
                local p = line and line:match("FNOS_PORT=(%d+)")
                if p then port = p end
            end
            local gw = "172.17.0.1"
            local h = io.open("/etc/hosts", "r")
            if h then
                for line in h:lines() do
                    local ip = line:match("^%s*([%d%.]+)%s+.*host%.docker%.internal")
                    if ip then gw = ip break end
                end
                h:close()
            end
            ngx.var.fnos_upstream = "http://" .. gw .. ":" .. port
        }
        proxy_pass $fnos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余所有请求反代到 fnOS 登录页（端口由 install_callback 探测写入 /config/upstream.conf，
    # 默认 5666；用户自定义 Web 端口时自动适配，不再写死）
    location / {
        set $fnos_upstream "http://172.17.0.1:5666";
        rewrite_by_lua_block {
            local port = "5666"
            local f = io.open("/config/upstream.conf", "r")
            if f then
                local line = f:read("*l"); f:close()
                local p = line and line:match("FNOS_PORT=(%d+)")
                if p then port = p end
            end
            local gw = "172.17.0.1"
            local h = io.open("/etc/hosts", "r")
            if h then
                for line in h:lines() do
                    local ip = line:match("^%s*([%d%.]+)%s+.*host%.docker%.internal")
                    if ip then gw = ip break end
                end
                h:close()
            end
            ngx.var.fnos_upstream = "http://" .. gw .. ":" .. port
        }
        proxy_pass $fnos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 关键: 清空入站 Accept-Encoding，强制上游返回未压缩的 index.html。
        # 否则浏览器带 Accept-Encoding: gzip 时，fnOS 会返回 gzip 压缩 HTML，
        # sub_filter 在压缩字节上匹配不到 "</body>"，注入脚本就不会出现(登录框/一言均失效)。
        proxy_set_header Accept-Encoding "";

        # 往 index.html 注入脚本（模板感知，模板名取自 /static/lhg-template.txt）：
        #   classic 经典: 背景图 + 左侧一言(72px 黑体加粗+链接) + 登录框靠右(右缘140px)
        #   focus   聚焦: 背景图 + 登录框居中，无一言
        #   minimal 极简: 纯色#004040(服务端改发 solid_bg.webp) + 登录框居中，无一言
        #   cow     牛牛: 背景图 + 登录框靠右 + 加载 /static/lhg-cow.js
        #                 （3 头卡通牛：眼球跟随/眨眼/聚焦倾斜/输密码回避/密码明文偷瞄）
        # 注: sub_filter 依赖响应缓冲，故此处 proxy_buffering 保持默认(on)
        # 注: 注入串用 nginx 双引号包裹，故 JS 只用单引号、无 $、无正则 \s；
        #     换行/逗号用 String.fromCharCode，不用字面 \n
        sub_filter "</body>" "<script>(function(){var done=false,qdone=false,TPL='classic';function find(){var c=document.querySelector('.gradient-border');if(c)return c;var p=document.querySelector('input[type=password]');if(!p)return null;var e=p,i;for(i=0;i<12&&e;i++){if(e.querySelectorAll('input').length>=2)return e;e=e.parentElement;}return e;}function apply(){var e=find();if(!e||e.__lhg)return;e.__lhg=true;var w=e.offsetWidth;e.style.position='fixed';e.style.top='50%';e.style.zIndex=99;if(TPL==='classic'||TPL==='cow'){e.style.right='140px';e.style.transform='translate(0,-50%)';}else{e.style.left='50%';e.style.right='auto';e.style.transform='translate(-50%,-50%)';}e.style.width=w+'px';done=true;var h=document.createElement('style');h.textContent='body{background:#004040!important}';document.head.appendChild(h);}function quote(){if(TPL!=='classic')return;try{fetch('/static/lhg-quote.txt').then(function(r){return r.text()}).then(function(t){var ls=t.split(String.fromCharCode(10)).filter(function(x){return x.indexOf('|')>0});if(!ls.length)return;var q=ls[Math.floor(Math.random()*ls.length)];var i=q.indexOf('|');var s=q.substring(0,i).trim(),a=q.substring(i+1).trim();var d=document.createElement('div');d.style.position='fixed';d.style.left='6%';d.style.top='50%';d.style.transform='translateY(-50%)';d.style.maxWidth='40%';d.style.color='#fff';d.style.fontSize='72px';d.style.fontFamily='SimHei,Microsoft YaHei,sans-serif';d.style.fontWeight='bold';d.style.lineHeight='1.8';d.style.zIndex=99;d.style.textShadow='0 2px 8px rgba(0,0,0,0.35)';var t1=document.createElement('div');var t1b=null;var ci=s.indexOf(String.fromCharCode(65292));if(ci<0)ci=s.indexOf(',');if(ci>0){t1.textContent=s.substring(0,ci+1);t1b=document.createElement('div');t1b.textContent=s.substring(ci+1).trim();}else{t1.textContent=s;}var t2=document.createElement('div');t2.textContent='—— '+a;t2.style.fontSize='36px';t2.style.opacity='0.75';t2.style.marginTop='16px';d.appendChild(t1);if(t1b)d.appendChild(t1b);d.appendChild(t2);var t3=document.createElement('div');t3.style.marginTop='30px';t3.style.display='inline-block';t3.style.border='1px solid rgba(255,255,255,0.55)';t3.style.borderRadius='10px';t3.style.background='rgba(255,255,255,0.08)';t3.style.padding='8px 16px';var mk=function(l,u){var x=document.createElement('a');x.textContent=l+' '+u;x.href='https://'+u;x.target='_blank';x.style.display='block';x.style.color='#fff';x.style.opacity='0.85';x.style.fontSize='17px';x.style.fontWeight='normal';x.style.fontFamily='PingFang SC, Microsoft YaHei, sans-serif';x.style.padding='4px 0';x.style.textDecoration='none';x.style.cursor='pointer';x.onmouseover=function(){x.style.opacity='1'};x.onmouseout=function(){x.style.opacity='0.85'};return x;};t3.appendChild(mk('飞牛官网','www.fnnas.com'));t3.appendChild(mk('飞牛论坛','club.fnnas.com'));d.appendChild(t3);d.className='lhg-quote';document.body.appendChild(d);}).catch(function(){})}catch(e){}}function load(t,s){var cs=document.createElement('script');cs.src=s;document.head.appendChild(cs);}function boot(){var n=0,t=setInterval(function(){var c=document.querySelector('.gradient-border');var q=document.querySelector('.lhg-quote');if(c){apply();if(!qdone){qdone=true;quote();}}else{if(q)q.remove();qdone=false;}n++;if(n>1500)clearInterval(t);},200);}fetch('/static/lhg-template.txt').then(function(r){return r.text()}).then(function(x){var nl=x.indexOf(String.fromCharCode(10));if(nl>0)x=x.substring(0,nl);if(x==='focus'||x==='minimal'||x==='cow')TPL=x;if(TPL==='cow')load('cow','/static/lhg-cow.js');boot();}).catch(function(){boot();});})();</script></body>";
        sub_filter_once on;
    }
}

# 合并窗口（统一网关 unix socket 接入，静态配置）
include /etc/nginx/lhg/portal-ports.conf;